[project]
name = "dandelion-app"
version = "0.0.1"
description = "Installer and graphical studio for the Dandelion European power price model."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["installer/build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
